<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Portfolio - Nichapa</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <style>
        body {
            margin: 0;
            background-color: #f4f4f4; /* Light grey background looks better for portfolios */
            color: #212254;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }

        header {
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #fff;
            border-bottom: 1px solid #ddd;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .title {
            font-size: 1.5rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .nav a {
            margin-left: 2rem;
            text-decoration: none;
            color: #212254;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.85rem;
            transition: 0.3s;
        }

        .nav a:hover { opacity: 0.5; }

        /* Container for the PDF pages */
        #pdf-viewer {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 0;
            gap: 20px;
        }

        /* Styling for each individual page */
        canvas {
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            background-color: white;
            max-width: 95%;
            height: auto !important; /* Ensures responsiveness */
        }

        .download {
            position: fixed;
            bottom: 30px;
            right: 30px;
            text-decoration: none;
            color: white;
            background: #212254;
            padding: 12px 20px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 4px;
            z-index: 1001;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* Loading State */
        #loading-info {
            text-align: center;
            padding: 50px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>

<header>
    <div class="title">Nichapa Eamcharoen</div>
    <div class="nav">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
    </div>
</header>

<div id="loading-info">Preparing Portfolio...</div>
<div id="pdf-viewer"></div>

<a class="download" href="jinnie portfolio.pdf" download>Download PDF</a>

<script>
    // Point this to your actual PDF file location
    const url = 'jinnie portfolio.pdf';

    // Set PDF.js worker
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const viewer = document.getElementById('pdf-viewer');
    const loadingInfo = document.getElementById('loading-info');

    // Load the PDF
    pdfjsLib.getDocument(url).promise.then(pdf => {
        loadingInfo.style.display = 'none'; // Hide loading text
        
        // Loop through every page in your PDF
        for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
            pdf.getPage(pageNum).then(page => {
                const viewport = page.getViewport({ scale: 1.5 }); // High resolution scale
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                
                viewer.appendChild(canvas);

                const renderContext = {
                    canvasContext: context,
                    viewport: viewport
                };
                page.render(renderContext);
            });
        }
    }).catch(err => {
        loadingInfo.textContent = "Error loading portfolio. Please check file path.";
        console.error(err);
    });
</script>

</body>
</html>
