<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Portfolio - Nichapa</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <style>
        body {
            margin: 0;
            background-color: #ffffff;
            color: #212254;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            overflow-x: hidden;
        }

        header {
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #fff;
            border-bottom: 1px solid #eeeeee;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .title {
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .nav a {
            margin-left: 2rem;
            text-decoration: none;
            color: #212254;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.8rem;
            transition: 0.3s;
        }

        .nav a:hover { opacity: 0.5; }

        /* Container for the PDF pages */
        #pdf-viewer {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0;
            background-color: #ffffff;
        }

        /* Styling for each individual page */
        canvas {
            display: block;
            width: 100%;
            max-width: 1200px; /* Limits size on ultra-wide screens */
            height: auto !important;
        }

        /* Loading State */
        #loading-info {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ccc;
        }
    </style>
</head>

<body>

<header>
    <div class="title">Nichapa Eamcharoen</div>
    <div class="nav">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
    </div>
</header>

<div id="loading-info">Loading Portfolio Content...</div>
<div id="pdf-viewer"></div>

<script>
    // Updated to match your specific filename
    const url = "jinnie's portfolio.pdf";

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const viewer = document.getElementById('pdf-viewer');
    const loadingInfo = document.getElementById('loading-info');

    pdfjsLib.getDocument(url).promise.then(pdf => {
        loadingInfo.style.display = 'none';
        
        // Render all pages in sequence
        for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
            pdf.getPage(pageNum).then(page => {
                // Adjust scale for high resolution rendering
                const viewport = page.getViewport({ scale: 2 });
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                
                viewer.appendChild(canvas);

                const renderContext = {
                    canvasContext: context,
                    viewport: viewport
                };
                page.render(renderContext);
            });
        }
    }).catch(err => {
        loadingInfo.textContent = "Unable to display portfolio.";
        console.error(err);
    });
</script>

</body>
</html>
