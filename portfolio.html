<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Portfolio – Nichapa</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  
  <style>
    body {
      margin: 0;
      font-family: Helvetica, Arial, sans-serif;
      background-color: #fff;
      color: #000;
      overflow-x: hidden;
    }

    /* Sidebar Styles */
    .sidebar {
      position: fixed;
      top: 1rem;
      left: 1rem;
      z-index: 2000; /* High z-index to stay above PDF */
    }

    .menu-icon {
      font-size: 1.8rem;
      cursor: pointer;
      color: #2c1d5a;
      background-color: transparent;
      border: none;
      padding: 0;
    }

    .menu-panel {
      position: absolute;
      top: 0;
      left: 2.5rem;
      background-color: white;
      border: 1px solid #ddd;
      padding: 1rem;
      border-radius: 6px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
      min-width: 180px;
      display: none;
    }

    .menu-panel.active {
      display: block;
    }

    .menu-panel h3 {
      text-transform: uppercase;
      font-size: 0.8rem;
      margin: 0.5rem 0;
      color: #f48ab6;
    }

    .menu-panel a {
      display: block;
      text-decoration: none;
      color: #333;
      font-size: 0.85rem;
      margin: 0.25rem 0;
    }

    .menu-panel a:hover {
      color: #f48ab6;
    }

    /* Content Container */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
      padding-top: 4rem; /* Space for the sidebar icon */
    }

    .page-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .page-header h1 {
      font-size: 2rem;
      color: #212254;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    /* PDF Viewer Styles */
    #pdf-viewer {
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #ffffff;
    }

    canvas {
      display: block;
      width: 100%;
      max-width: 1100px;
      height: auto !important;
      margin-bottom: 10px;
    }

    #loading-info {
      text-align: center;
      padding: 50px;
      color: #ccc;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>
  <div class="sidebar">
    <button class="menu-icon" onclick="toggleMenu()">☰</button>
    <div class="menu-panel" id="menuPanel">
      <h3>HOME</h3>
      <a href="index.html">Home</a>
      <h3>PROJECTS</h3>
      <a href="project.html">Architectural Project</a>
      <a href="illustration.html">Illustration</a>
      <a href="artsncrafts.html">Arts n Crafts</a>
      <a href="some-more-work.html">Other</a>
      <h3>ABOUT</h3>
      <a href="about.html">Profile</a>
      <a href="portfolio.html">Portfolio</a>
    </div>
  </div>

  <div class="container">
    <div class="page-header">
      <h1>Portfolio</h1>
    </div>

    <div id="loading-info">Loading Portfolio Content...</div>
    <div id="pdf-viewer"></div>
  </div>

  <script>
    // --- Sidebar JavaScript ---
    function toggleMenu() {
      const panel = document.getElementById("menuPanel");
      panel.classList.toggle("active");
    }

    // Close menu if user clicks outside of it
    document.addEventListener("click", function (event) {
      const sidebar = document.querySelector(".sidebar");
      const panel = document.getElementById("menuPanel");
      if (!sidebar.contains(event.target)) {
        panel.classList.remove("active");
      }
    });

    // --- PDF.js JavaScript ---
    const url = "port mock upodate_compressed.pdf";
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const viewer = document.getElementById('pdf-viewer');
    const loadingInfo = document.getElementById('loading-info');

    pdfjsLib.getDocument(url).promise.then(pdf => {
      loadingInfo.style.display = 'none';
      
      // Render every page
      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        pdf.getPage(pageNum).then(page => {
          const viewport = page.getViewport({ scale: 2 }); // High quality scale
          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d');
          
          canvas.height = viewport.height;
          canvas.width = viewport.width;
          
          viewer.appendChild(canvas);

          const renderContext = {
            canvasContext: context,
            viewport: viewport
          };
          page.render(renderContext);
        });
      }
    }).catch(err => {
      loadingInfo.textContent = "Error: Portfolio file not found.";
      console.error(err);
    });
  </script>
</body>
</html>
