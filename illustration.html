<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>illustration – Nichapa</title>

  <style>
    /* =========================
       Sidebar
    ========================= */

    .sidebar {
      position: fixed;
      top: 1rem;
      left: 1rem;
      z-index: 1000;
    }

    .menu-icon {
      font-size: 1.8rem;
      cursor: pointer;
      color: #2c1d5a;
      background-color: transparent;
      border: none;
      padding: 0;
    }

    .menu-panel {
      position: absolute;
      top: 0;
      left: 2.5rem;
      background-color: white;
      border: 1px solid #ddd;
      padding: 1rem;
      border-radius: 6px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
      min-width: 180px;
      display: none;
    }

    .menu-panel.active {
      display: block;
    }

    .menu-panel h3 {
      text-transform: uppercase;
      font-size: 0.8rem;
      margin: 0.5rem 0;
      color: #f48ab6;
    }

    .menu-panel a {
      display: block;
      text-decoration: none;
      color: #333;
      font-size: 0.85rem;
      margin: 0.25rem 0;
    }

    .menu-panel a:hover {
      color: #f48ab6;
    }


    /* =========================
       Main Layout
    ========================= */

    body {
      margin: 0;
      font-family: Helvetica, Arial, sans-serif;
      background-color: #f3f4f6;
      color: #000;
      overflow-x: hidden;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }


    /* =========================
       Page Header
    ========================= */

    .page-header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .page-header h1 {
      font-size: 2.5rem;
      color: #212254;
      margin: 0;
      font-weight: normal;
    }


    /* =========================
       Selected Work / Project Grid
    ========================= */

    .selected-work {
      margin-bottom: 4rem;
    }

    .section-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #f48ab6;
      margin: 0 0 1rem 0;
    }

    .project-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.5rem;
    }

    .project-item {
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .project-image {
      overflow: hidden;
      background-color: white;
    }

    .project-image img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.4s ease;
    }

    .project-item:hover .project-image img {
      transform: scale(1.03);
    }

    .project-info {
      padding-top: 0.7rem;
    }

    .project-info h2 {
      margin: 0;
      font-size: 1rem;
      font-weight: normal;
      color: #212254;
    }

    .project-info p {
      margin: 0.25rem 0 0;
      font-size: 0.8rem;
      color: #555;
    }


    /* =========================
       Illustration Section
    ========================= */

    .illustration-section {
      margin-top: 1rem;
    }

    .image-grid {
      column-count: 3;
      column-gap: 1.5rem;
    }

    .grid-item {
      display: inline-block;
      margin-bottom: 1.5rem;
      width: 100%;
      break-inside: avoid;
    }

    .grid-item img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .grid-item img:hover {
      transform: scale(1.05);
    }


    /* =========================
       Lightbox
    ========================= */

    .lightbox {
      position: fixed;
      z-index: 2000;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: none;
      align-items: center;
      justify-content: center;
    }

    .lightbox-content {
      max-width: 90%;
      max-height: 90%;
    }

    .close {
      position: absolute;
      top: 20px;
      right: 40px;
      color: #fff;
      font-size: 40px;
      font-weight: bold;
      transition: 0.3s;
      cursor: pointer;
    }

    .close:hover,
    .close:focus {
      color: #bbb;
      text-decoration: none;
    }


    /* =========================
       Tablet
    ========================= */

    @media (max-width: 768px) {

      .image-grid {
        column-count: 2;
      }

      .project-grid {
        grid-template-columns: repeat(2, 1fr);
      }

    }


    /* =========================
       Mobile
    ========================= */

    @media (max-width: 480px) {

      .container {
        padding: 1.5rem;
      }

      .page-header h1 {
        font-size: 2rem;
      }

      .project-grid {
        grid-template-columns: 1fr;
      }

      .image-grid {
        column-count: 1;
      }

      .close {
        right: 20px;
      }

    }

  </style>
</head>


<body>

  <!-- =========================
       Sidebar
  ========================= -->

  <div class="sidebar">

    <button class="menu-icon" onclick="toggleMenu()">☰</button>

    <div class="menu-panel" id="menuPanel">

      <h3>HOME</h3>
      <a href="index.html">Home</a>

      <h3>PROJECTS</h3>
      <a href="project.html">Architectural Project</a>
      <a href="illustration.html">Illustration</a>
      <a href="arts-n-crafts.html">Arts n Crafts</a>
      <a href="some-more-work.html">Other</a>

      <h3>ABOUT</h3>
      <a href="about.html">Profile</a>
      <a href="portfolio.html">Portfolio</a>

    </div>

  </div>


  <!-- =========================
       Main Content
  ========================= -->

  <div class="container">

    <!-- Page Title -->

    <div class="page-header">
      <h1>illustration</h1>
    </div>


    <!-- =========================
         Selected Work
    ========================= -->

    <section class="selected-work">

      <h3 class="section-title">selected work</h3>

      <div class="project-grid">

        <!-- Project 1 -->

        <a href="branding.html" class="project-item">

          <div class="project-image">
            <img
              src="branding-cover.jpg"
              alt="Brand Identity Project"
            />
          </div>

          <div class="project-info">
            <h2>Brand Identity</h2>
            <p>Branding · Visual Identity</p>
          </div>

        </a>


        <!-- Project 2 -->

        <a href="graphic.html" class="project-item">

          <div class="project-image">
            <img
              src="graphic-cover.jpg"
              alt="Graphic Design Project"
            />
          </div>

          <div class="project-info">
            <h2>Graphic Work</h2>
            <p>Graphic Design · Art Direction</p>
          </div>

        </a>

      </div>

    </section>


    <!-- =========================
         Illustration Archive
    ========================= -->

    <section class="illustration-section">

      <h3 class="section-title">illustration</h3>

      <div class="image-grid">

        <div class="grid-item">
          <img
            src="sleepy doggo color map2.jpg"
            alt="Sleepy Doggo illustration"
          />
        </div>

        <div class="grid-item">
          <img
            src="sc ps.png"
            alt="Illustration"
          />
        </div>

        <div class="grid-item">
          <img
            src="ps a week-03.jpg"
            alt="Illustration"
          />
        </div>

        <div class="grid-item">
          <img
            src="flower2.png"
            alt="Flower illustration"
          />
        </div>

      </div>

    </section>

  </div>


  <!-- =========================
       Lightbox
  ========================= -->

  <div id="lightbox" class="lightbox">

    <span class="close">&times;</span>

    <img
      class="lightbox-content"
      id="lightbox-img"
      alt=""
    />

  </div>


  <!-- =========================
       JavaScript
  ========================= -->

  <script>

    /* Sidebar Menu */

    function toggleMenu() {
      const panel = document.getElementById("menuPanel");
      panel.classList.toggle("active");
    }

    document.addEventListener("click", function (event) {

      const sidebar = document.querySelector(".sidebar");
      const panel = document.getElementById("menuPanel");

      if (!sidebar.contains(event.target)) {
        panel.classList.remove("active");
      }

    });


    /* Lightbox */

    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightbox-img");
    const closeBtn = document.querySelector(".close");
    const gridItems = document.querySelectorAll(".grid-item img");


    gridItems.forEach(item => {

      item.addEventListener("click", () => {

        lightbox.style.display = "flex";

        lightboxImg.src = item.src;
        lightboxImg.alt = item.alt;

      });

    });


    /* Close button */

    closeBtn.addEventListener("click", () => {

      lightbox.style.display = "none";

    });


    /* Close when clicking outside image */

    lightbox.addEventListener("click", (event) => {

      if (
        event.target === lightbox ||
        event.target === lightboxImg
      ) {

        lightbox.style.display = "none";

      }

    });


    /* Close with ESC */

    document.addEventListener("keydown", (event) => {

      if (event.key === "Escape") {

        lightbox.style.display = "none";

      }

    });

  </script>

</body>
</html>
