<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Other – Nichapa</title>

<style>

body{
margin:0;
font-family:Helvetica, Arial, sans-serif;
background:#f3f4f6;
overflow-x:hidden;
}

.container{
max-width:1200px;
margin:auto;
padding:2rem;
}

.page-header{
text-align:center;
margin-bottom:2rem;
}

.page-header h1{
font-size:2.5rem;
color:#212254;
}

/* SIDEBAR */

.sidebar{
position:fixed;
top:1rem;
left:1rem;
z-index:1000;
}

.menu-icon{
font-size:1.8rem;
cursor:pointer;
border:none;
background:none;
}

.menu-panel{
position:absolute;
top:0;
left:2.5rem;
background:white;
border:1px solid #ddd;
padding:1rem;
border-radius:6px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
min-width:180px;
display:none;
}

.menu-panel.active{
display:block;
}

.menu-panel h3{
font-size:.8rem;
margin:.5rem 0;
color:#f48ab6;
}

.menu-panel a{
display:block;
text-decoration:none;
color:#333;
font-size:.85rem;
margin:.25rem 0;
}

/* GRID */

.image-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:1.5rem;
}

.grid-item{
overflow:hidden;
border-radius:8px;
box-shadow:0 3px 8px rgba(0,0,0,0.1);
cursor:pointer;
aspect-ratio:1/1;
}

.grid-item img{
width:100%;
height:100%;
object-fit:cover;
transition:transform .3s;
}

.grid-item img:hover{
transform:scale(1.05);
}

/* CARD POPUP */

.card-stack-overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.9);
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:2000;
}

.card-stack-wrapper{
position:relative;
width:320px;
height:420px;
perspective:1200px;
}

/* CARD */

.card{
position:absolute;
width:100%;
height:100%;
border-radius:12px;
overflow:hidden;
cursor:pointer;
transition:transform .5s, box-shadow .3s;
box-shadow:0 10px 25px rgba(0,0,0,0.4);
}

.card img{
width:100%;
height:100%;
object-fit:cover;
}

/* ZOOM */

.card.active{
transform:scale(1.2) !important;
z-index:100;
cursor:default;
}

/* BUTTONS */

.close-btn{
position:absolute;
top:30px;
right:40px;
font-size:40px;
color:white;
cursor:pointer;
}

.back-btn{
margin-top:20px;
padding:10px 20px;
background:#2c1d5a;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
display:none;
}

#card-caption{
color:white;
margin-top:20px;
text-align:center;
max-width:500px;
}

</style>
</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

<button class="menu-icon" onclick="toggleMenu()">☰</button>

<div class="menu-panel" id="menuPanel">

<h3>HOME</h3>
<a href="index.html">Home</a>

<h3>PROJECTS</h3>
<a href="architecture.html">Architecture</a>
<a href="illustration.html">Illustration</a>
<a href="arts-n-crafts.html">Arts n Crafts</a>
<a href="some-more-work.html">Other</a>

<h3>ABOUT</h3>
<a href="about.html">Profile</a>

</div>
</div>


<div class="container">

<div class="page-header">
<h1>Other Works</h1>
</div>

<div class="image-grid">

<div class="grid-item">
<img src="blender node-01.png">
</div>

<div class="grid-item">
<img src="[C09]_WK3_3.2_Perspective.png">
</div>

<div class="grid-item">
<img src="grasshopper-01.png">
</div>

<div class="grid-item">
<img src="devinska tower.png">
</div>

<div class="grid-item">
<img src="facade sq.jpg">
</div>

<div class="grid-item">
<img src="animal crossing3.jpeg">
</div>

</div>
</div>


<!-- POPUP -->

<div class="card-stack-overlay" id="overlay">

<span class="close-btn" id="close">&times;</span>

<div class="card-stack-wrapper" id="stack"></div>

<p id="card-caption"></p>

<button class="back-btn" id="back">Back</button>

</div>


<script>

/* SIDEBAR */

function toggleMenu(){
document.getElementById("menuPanel").classList.toggle("active");
}

document.addEventListener("click",function(e){

const sidebar=document.querySelector(".sidebar");
const panel=document.getElementById("menuPanel");

if(!sidebar.contains(e.target)){
panel.classList.remove("active");
}

});

/* ELEMENTS */

const overlay=document.getElementById("overlay");
const stack=document.getElementById("stack");
const closeBtn=document.getElementById("close");
const backBtn=document.getElementById("back");
const caption=document.getElementById("card-caption");

let activeCard=null;

/* IMAGE SETS */

const imageSets={

"blender node-01.png":[
{src:"blender node-01.png",caption:"Blender node exploration"},
{src:"render pic dts3.png",caption:"Blender render"},
{src:"render pic dts8.png",caption:"Lighting test"}
],

"[C09]_WK3_3.2_Perspective.png":[
{src:"[C09]_WK3_3.2_Perspective.png",caption:"Perspective study"},
{src:"scene character other.jpg",caption:"Scene composition"},
{src:"scene character other2.jpg",caption:"Lighting test"}
],

"grasshopper-01.png":[
{src:"grasshopper-01.png",caption:"Grasshopper parametric design"},
{src:"grasshopper2.png",caption:"Parametric exploration"}
],

"devinska tower.png":[
{src:"devinska tower.png",caption:"Devinska tower analysis"},
{src:"devinska model.png",caption:"Model study"},
{src:"devinska draw.png",caption:"Architectural drawing"}
],

"facade sq.jpg":[
{src:"facade.png",caption:"Facade study"},
{src:"Image2_0001.png",caption:"Facade iteration"},
{src:"IMG_7988.JPG",caption:"Render test"}
],

"animal crossing3.jpeg":[
{src:"animal crossing1.jpg",caption:"Concept scene"},
{src:"animal crossing2.jpg",caption:"Bridge design"},
{src:"animal crossing3.jpeg",caption:"Final composition"}
]

};


/* CREATE STACK */

function renderStack(set){

stack.innerHTML="";
caption.textContent="";
backBtn.style.display="none";

set.forEach((item,index)=>{

const card=document.createElement("div");
card.classList.add("card");

const img=document.createElement("img");
img.src=item.src;
img.dataset.caption=item.caption;

card.appendChild(img);

/* STACK POSITION */

const rotate=(index-1)*10;
const offset=(1-index)*20;

card.style.transform=`translateY(${offset}px) rotate(${rotate}deg)`;
card.style.zIndex=10-index;

stack.appendChild(card);

});

}

/* GRID CLICK */

document.querySelectorAll(".grid-item img").forEach(img=>{

img.addEventListener("click",()=>{

const name=img.getAttribute("src");

const set=imageSets[name]||[{src:name,caption:""}];

renderStack(set);

overlay.style.display="flex";

});

});

/* CARD CLICK */

stack.addEventListener("click",e=>{

const card=e.target.closest(".card");

if(!card)return;

if(activeCard){
activeCard.classList.remove("active");
}

card.classList.add("active");
activeCard=card;

caption.textContent=card.querySelector("img").dataset.caption;

backBtn.style.display="block";

});

/* BACK */

backBtn.onclick=()=>{

if(activeCard){
activeCard.classList.remove("active");
activeCard=null;
}

caption.textContent="";
backBtn.style.display="none";

};

/* CLOSE */

closeBtn.onclick=()=>{
overlay.style.display="none";
};

overlay.addEventListener("click",e=>{
if(e.target===overlay){
overlay.style.display="none";
}
});

</script>

</body>
</html>
