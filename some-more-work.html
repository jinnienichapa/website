<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Other – Nichapa</title>

<style>

body{
margin:0;
font-family:Helvetica, Arial, sans-serif;
background:#f3f4f6;
color:#000;
overflow-x:hidden;
}

.container{
max-width:1200px;
margin:auto;
padding:2rem;
}

.page-header{
text-align:center;
margin-bottom:2rem;
}

.page-header h1{
font-size:2.5rem;
color:#212254;
}

/* SIDEBAR */

.sidebar{
position:fixed;
top:1rem;
left:1rem;
z-index:1000;
}

.menu-icon{
font-size:1.8rem;
cursor:pointer;
border:none;
background:none;
color:#2c1d5a;
}

.menu-panel{
position:absolute;
top:0;
left:2.5rem;
background:white;
border:1px solid #ddd;
padding:1rem;
border-radius:6px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
min-width:180px;
display:none;
max-height:90vh;
overflow-y:auto;
}

.menu-panel.active{
display:block;
}

.menu-panel h3{
text-transform:uppercase;
font-size:.8rem;
margin:.5rem 0;
color:#f48ab6;
}

.menu-panel a{
display:block;
text-decoration:none;
color:#333;
font-size:.85rem;
margin:.25rem 0;
}

.menu-panel a:hover{
color:#f48ab6;
}

/* GRID */

.image-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:1.5rem;
}

.grid-item{
overflow:hidden;
border-radius:8px;
box-shadow:0 3px 8px rgba(0,0,0,0.1);
cursor:pointer;
aspect-ratio:1/1;
}

.grid-item img{
width:100%;
height:100%;
object-fit:cover;
display:block;
transition:transform .3s;
}

.grid-item img:hover{
transform:scale(1.05);
}

/* CARD STACK */

.card-stack-overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.9);
display:none;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:2000;
}

.card-stack-wrapper{
position:relative;
width:50vmin;
height:65vmin;
display:flex;
justify-content:center;
align-items:center;
}

.card{
position:absolute;
width:100%;
height:100%;
box-shadow:0 5px 20px rgba(0,0,0,.5);
transition:transform .5s, box-shadow .3s;
transform-origin:50% 100%;
overflow:hidden;
border-radius:12px;
cursor:pointer;
}

.card img{
width:100%;
height:100%;
object-fit:cover;
}

/* stack positions */

.card:nth-child(1){
transform:translateY(-40px) rotate(-10deg);
z-index:3;
}

.card:nth-child(2){
transform:translateY(-20px) rotate(0deg);
z-index:2;
}

.card:nth-child(3){
transform:translateY(0) rotate(10deg);
z-index:1;
}

.card:hover{
transform:translateY(-50px) scale(1.1);
box-shadow:0 10px 30px rgba(0,0,0,.7);
z-index:4;
}

.card.active{
transform:scale(1.2) !important;
z-index:100;
cursor:default;
}

.card-stack-wrapper.zoomed .card:not(.active){
pointer-events:none;
}

/* CONTROLS */

.close-btn{
position:absolute;
top:20px;
right:40px;
color:white;
font-size:40px;
cursor:pointer;
}

.back-btn{
position:absolute;
bottom:20px;
padding:10px 20px;
background:#2c1d5a;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
display:none;
}

#card-caption{
color:white;
margin-top:2rem;
text-align:center;
max-width:600px;
opacity:0;
transition:opacity .4s;
}

.card-stack-wrapper.zoomed ~ #card-caption{
opacity:1;
}

</style>
</head>

<body>

<div class="sidebar">
<button class="menu-icon" onclick="toggleMenu()">☰</button>

<div class="menu-panel" id="menuPanel">
<h3>HOME</h3>
<a href="index.html">Home</a>

<h3>PROJECTS</h3>
<a href="architecture.html">Architectural Project</a>
<a href="illustration.html">Illustration</a>
<a href="arts-n-crafts.html">Arts n Crafts</a>
<a href="some-more-work.html">Other</a>

<h3>ABOUT</h3>
<a href="about.html">Profile</a>
</div>
</div>


<div class="container">

<div class="page-header">
<h1>Other</h1>
</div>

<div class="image-grid">

<div class="grid-item">
<img src="blender node-01.png">
</div>

<div class="grid-item">
<img src="[C09]_WK3_3.2_Perspective.png">
</div>

<div class="grid-item">
<img src="grasshopper-01.png">
</div>

<div class="grid-item">
<img src="devinska tower.png">
</div>

<div class="grid-item">
<img src="facade sq.jpg">
</div>

<div class="grid-item">
<img src="animal crossing3.jpeg">
</div>

</div>
</div>


<div class="card-stack-overlay" id="overlay">

<div class="card-stack-wrapper" id="stack"></div>

<p id="card-caption"></p>

<span class="close-btn" id="close">&times;</span>

<button class="back-btn" id="back">Back to Stack</button>

</div>


<script>

/* sidebar */

function toggleMenu(){
document.getElementById("menuPanel").classList.toggle("active");
}

document.addEventListener("click",function(e){

const sidebar=document.querySelector(".sidebar");
const panel=document.getElementById("menuPanel");

if(!sidebar.contains(e.target)){
panel.classList.remove("active");
}

});

/* card stack */

const overlay=document.getElementById("overlay");
const stack=document.getElementById("stack");
const closeBtn=document.getElementById("close");
const backBtn=document.getElementById("back");
const caption=document.getElementById("card-caption");

let activeCard=null;

/* IMAGE SETS */

const imageSets={

"blender node-01.png":[
{src:"blender node-01.png",caption:"Blender node exploration"},
{src:"render pic dts3.png",caption:"Blender node exploration"},
{src:"render pic dts8.png",caption:"Blender node exploration"}
],

"[C09]_WK3_3.2_Perspective.png":[
{src:"[C09]_WK3_3.2_Perspective.png",caption:"Blender scene workshop"},
{src:"scene character other2.jpg",caption:"Blender scene workshop"},
{src:"scene character other.jpg",caption:"Blender scene workshop"}
],

"grasshopper-01.png":[
{src:"grasshopper-01.png",caption:"Parametric design in Grasshopper"},
{src:"grasshopper2.png",caption:"3D print workshop"}
],

"devinska tower.png":[
{src:"devinska tower.png",caption:"Devinska Kobyla tower analysis"},
{src:"devinska model.png",caption:"Model analysis"},
{src:"devinska draw.png",caption:"Drawing analysis"}
],

"facade sq.jpg":[
{src:"facade.png",caption:"Facade design"},
{src:"Image2_0001.png",caption:"Facade workshop"},
{src:"IMG_7988.JPG",caption:"Facade rendering"}
],

"animal crossing3.jpeg":[
{src:"animal crossing1.jpg",caption:"Community design"},
{src:"animal crossing2.jpg",caption:"Parametric bridge"},
{src:"animal crossing3.jpeg",caption:"Project overview"}
]

};

/* RENDER STACK */

function renderStack(set){

stack.innerHTML="";
caption.textContent="";
backBtn.style.display="none";
stack.classList.remove("zoomed");

set.forEach(item=>{

const card=document.createElement("div");
card.classList.add("card");

const img=document.createElement("img");
img.src=item.src;
img.dataset.caption=item.caption;

card.appendChild(img);
stack.appendChild(card);

});

}

/* ZOOM CARD */

function zoomCard(card){

if(activeCard){
activeCard.classList.remove("active");
}

card.classList.add("active");
activeCard=card;

stack.classList.add("zoomed");

caption.textContent=card.querySelector("img").dataset.caption;

backBtn.style.display="block";

}

/* GRID CLICK */

document.querySelectorAll(".grid-item img").forEach(img=>{

img.addEventListener("click",()=>{

const name=img.getAttribute("src");

const set=imageSets[name]||[{src:name,caption:""}];

renderStack(set);

overlay.style.display="flex";

});

});

/* STACK CLICK */

stack.addEventListener("click",e=>{

const card=e.target.closest(".card");

if(card){
zoomCard(card);
}

});

/* RESET */

function reset(){

if(activeCard){
activeCard.classList.remove("active");
activeCard=null;
}

stack.classList.remove("zoomed");

caption.textContent="";
backBtn.style.display="none";

}

/* BUTTONS */

backBtn.onclick=reset;

closeBtn.onclick=()=>{
reset();
overlay.style.display="none";
};

overlay.addEventListener("click",e=>{

if(e.target===overlay){
reset();
overlay.style.display="none";
}

});

</script>

</body>
</html>
